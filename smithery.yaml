# Smithery.ai MCP Server Configuration for Purple8 Hyper Graph
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - apiKey
    properties:
      url:
        type: string
        title: Purple8 Server URL
        description: Base URL of your Purple8 Hyper Graph instance or Cloud Sandbox.
        default: https://purple8-graph-sandbox.fly.dev
      apiKey:
        type: string
        title: Purple8 API / Sandbox Key
        description: API key or free 30-day Cloud Sandbox key from https://www.purple8.ai/try/graph/
      profile:
        type: string
        title: MCP Tool Profile
        description: Focused tool profile (starter=28 tools, builder=117 tools, ops=37 tools, full=176 tools).
        enum:
          - starter
          - builder
          - ops
          - full
        default: starter
  commandFunction: |-
    (config) => ({
      command: 'python',
      args: [
        '-m',
        'purple8_graph.mcp_server',
        '--url',
        config.url || 'https://purple8-graph-sandbox.fly.dev',
        '--api-key',
        config.apiKey,
        '--profile',
        config.profile || 'starter'
      ]
    })
