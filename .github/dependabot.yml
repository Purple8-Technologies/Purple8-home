version: 2

# Continuous dependency hygiene — security fixes as soon as advisories land,
# weekly grouped patch/minor bumps; .github/workflows/dependabot-auto-merge.yml
# merges them once the CI build is green and routes majors to a human.

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: {interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/London"}
    open-pull-requests-limit: 10
    labels: ["dependencies", "automated"]
    commit-message: {prefix: "chore(deps)", include: "scope"}
    groups:
      npm-security: {applies-to: security-updates, patterns: ["*"]}
      npm-minor-patch: {applies-to: version-updates, update-types: ["minor", "patch"], patterns: ["*"]}

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: {interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/London"}
    labels: ["dependencies", "automated"]
    commit-message: {prefix: "chore(ci)", include: "scope"}
    groups:
      actions: {patterns: ["*"]}
