name: CI

# Pull-request gate: the static export must build. Dependabot PRs are only
# auto-merged once this passes (see dependabot-auto-merge.yml).

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Audit (high+)
        run: npm audit --audit-level=high --omit=dev
